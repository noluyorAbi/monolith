version: 2
updates:
  # A cooldown is the cheap defence against a compromised release: the window
  # between a malicious version being published and being yanked is usually
  # hours, and without this Dependabot would open the PR inside that window.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      all:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
